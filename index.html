<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16283C">
<title>동이의 사라진 생활 기억</title>
<style>
:root{
  --ink:#16283C;        /* 쪽빛 남색 */
  --ink-deep:#0E1B2A;
  --paper:#F5EFE1;      /* 한지 */
  --paper-dim:#E4DBC7;
  --line:#C9BCA0;
  --text:#243247;
  --muted:#6B7688;
  --gold:#D9A441;
  --ok:#3E7C59;
  --no:#B8442C;
  /* 역할 색 = 실물 배지 색과 맞춤 */
  --r-evidence:#2F6FA8;
  --r-photo:#3E7C59;
  --r-record:#7A5AA8;
  --r-present:#D9873A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",sans-serif;
  font-size:17px;line-height:1.6;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
#app{display:flex;flex-direction:column;min-height:100%;max-width:560px;margin:0 auto}

/* ── 상단 바 ───────────────────────── */
#bar{
  position:sticky;top:0;z-index:20;
  background:var(--ink-deep);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  border-bottom:1px solid rgba(245,239,225,.12);
}
#bar.hidden{display:none}
.barrow{display:flex;align-items:center;gap:10px}
.group{font-weight:800;font-size:15px;letter-spacing:-.02em}
.slots{display:flex;gap:6px;margin-left:auto}
.slot{
  width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;font-size:15px;
  background:rgba(245,239,225,.07);
  border:1px solid rgba(245,239,225,.18);
  filter:grayscale(1);opacity:.45;
}
.slot.on{filter:none;opacity:1;border-color:var(--gold);background:rgba(217,164,65,.16)}
.turn{
  margin-top:9px;display:flex;align-items:center;gap:8px;
  padding:7px 12px;border-radius:999px;font-size:14px;font-weight:700;
  background:var(--role,#2F6FA8);color:#fff;
}
.turn.none{display:none}

/* ── 본문 ─────────────────────────── */
main{flex:1;padding:20px 16px 8px}
.eyebrow{font-size:14px;color:var(--gold);font-weight:700;margin:0 0 6px}
h1{font-size:30px;line-height:1.25;letter-spacing:-.035em;font-weight:900;margin:0 0 14px}
h2{font-size:21px;line-height:1.35;letter-spacing:-.03em;font-weight:800;margin:0 0 12px}
p{margin:0 0 12px}
.lede{font-size:18px;color:rgba(245,239,225,.86)}

/* 동이 말풍선 */
.dongi{
  display:flex;gap:12px;align-items:flex-start;
  background:rgba(245,239,225,.06);
  border:1px solid rgba(245,239,225,.14);
  border-left:4px solid var(--gold);
  border-radius:4px 14px 14px 4px;
  padding:14px 15px;margin:0 0 18px;
}
.dongi .face{font-size:30px;line-height:1}
.dongi p{margin:0;font-size:17px}

/* 한지 카드 */
.card{
  background:var(--paper);color:var(--text);
  border-radius:12px;padding:18px 16px;margin:0 0 16px;
  box-shadow:0 6px 0 rgba(0,0,0,.18);
}
.card h3{margin:0 0 12px;font-size:19px;font-weight:800;letter-spacing:-.02em}
.card .sub{color:var(--muted);font-size:15px;margin:-6px 0 14px}

/* 미션 목표 */
ol.goals{margin:0;padding:0;list-style:none;counter-reset:g}
ol.goals li{
  counter-increment:g;position:relative;padding:9px 0 9px 34px;
  border-bottom:1px dashed var(--line);font-size:16px;
}
ol.goals li:last-child{border-bottom:0}
ol.goals li::before{
  content:counter(g);position:absolute;left:0;top:9px;
  width:23px;height:23px;border-radius:50%;background:var(--ink);color:var(--paper);
  display:grid;place-items:center;font-size:13px;font-weight:800;
}

/* 선택지 */
.opts{display:flex;flex-wrap:wrap;gap:9px}
.opt{
  display:inline-flex;align-items:center;gap:8px;
  min-height:50px;padding:10px 15px;
  border:2px solid var(--line);border-radius:10px;
  background:#fff;color:var(--text);
  font:inherit;font-weight:600;font-size:16px;cursor:pointer;
}
.opt.wide{width:100%;justify-content:flex-start}
.opt .box{
  width:22px;height:22px;border:2px solid var(--line);border-radius:6px;
  flex:none;display:grid;place-items:center;font-size:14px;color:#fff;
}
.opt[aria-pressed="true"]{border-color:var(--ink);background:#EDE4CE}
.opt[aria-pressed="true"] .box{background:var(--ink);border-color:var(--ink)}
.opt[aria-pressed="true"] .box::after{content:"✓"}

/* 입력 */
input[type=text],textarea,select{
  width:100%;font:inherit;font-size:17px;color:var(--text);
  background:#fff;border:2px solid var(--line);border-radius:10px;
  padding:12px 13px;min-height:50px;
}
textarea{min-height:110px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus,.opt:focus-visible,button:focus-visible{
  outline:3px solid var(--gold);outline-offset:2px
}
label.field{display:block;font-weight:700;font-size:15px;margin:0 0 7px}

/* 짝 맞추기 */
.pair{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.pair:last-child{border-bottom:0}
.pair .k{flex:none;width:96px;font-weight:800;font-size:16px}
.pair select{margin:0}

/* 빈칸 문장 */
.fill{font-size:17px;line-height:2.5}
.fill input{
  display:inline-block;width:auto;min-width:120px;max-width:100%;
  min-height:44px;padding:6px 10px;margin:0 3px;text-align:center;
}

/* 요약(자동 표시) */
.auto{background:var(--paper-dim);border-radius:10px;padding:13px 14px;margin:0 0 14px}
.auto dt{font-size:13px;color:var(--muted);font-weight:700}
.auto dd{margin:2px 0 10px;font-size:16px;font-weight:700;color:var(--text)}
.auto dd:last-child{margin-bottom:0}
.tagline{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--ink);color:var(--paper);border-radius:999px;padding:4px 11px;font-size:14px;font-weight:700}

/* 피드백 */
.fb{border-radius:10px;padding:13px 14px;margin:14px 0 0;font-size:16px;font-weight:600}
.fb.ok{background:#E2EFE6;color:#255C3E;border:2px solid var(--ok)}
.fb.no{background:#F6E3DE;color:#8C2F1C;border:2px solid var(--no)}
.fb.tip{background:#FBF0D8;color:#7A5A16;border:2px solid var(--gold)}

/* 버튼 */
footer{
  position:sticky;bottom:0;z-index:20;
  background:linear-gradient(to top,var(--ink) 72%,rgba(22,40,60,0));
  padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);
}
button.go{
  width:100%;min-height:60px;border:0;border-radius:14px;
  font:inherit;font-size:19px;font-weight:800;letter-spacing:-.02em;
  background:var(--gold);color:#2A1D05;cursor:pointer;
  box-shadow:0 5px 0 #A87D2C;
}
button.go:active{transform:translateY(3px);box-shadow:0 2px 0 #A87D2C}
button.go[disabled]{background:#5D6B7E;color:rgba(255,255,255,.6);box-shadow:0 5px 0 #45505F}
button.ghost{
  width:100%;min-height:48px;margin-top:10px;border:2px solid rgba(245,239,225,.35);
  border-radius:12px;background:none;color:var(--paper);font:inherit;font-weight:700;cursor:pointer;
}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:15px;font-weight:700;text-decoration:underline;padding:6px 0;cursor:pointer}

/* 역할 전환 화면 */
#handoff{
  position:fixed;inset:0;z-index:60;display:none;
  flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:28px;background:var(--role);color:#fff;
}
#handoff.show{display:flex;animation:slidein .28s ease-out}
@keyframes slidein{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
#handoff .icon{font-size:66px;line-height:1}
#handoff .role{font-size:23px;font-weight:800;margin:10px 0 2px;opacity:.9}
#handoff .who{font-size:44px;font-weight:900;letter-spacing:-.04em;margin:0 0 6px}
#handoff .hint{font-size:18px;opacity:.9;margin:0 0 30px}
#handoff button{
  min-width:250px;min-height:62px;border:0;border-radius:14px;
  font:inherit;font-size:19px;font-weight:800;background:#fff;color:var(--role);cursor:pointer;
}

/* 완료 연출 */
.trophy{text-align:center;padding:14px 0 4px}
.trophy .em{font-size:70px;line-height:1}
.trophy .mood{font-size:22px;font-weight:800;margin:8px 0 0}
.reward{display:flex;gap:10px;margin:16px 0 0}
.reward div{
  flex:1;background:rgba(217,164,65,.14);border:1px solid rgba(217,164,65,.5);
  border-radius:10px;padding:11px;text-align:center;font-size:15px;font-weight:700;
}
.reward span{display:block;font-size:12px;color:var(--gold);font-weight:700;margin-bottom:3px}

/* 시작 화면 */
.hero{padding:20px 0 6px}
.hero .kicker{font-size:15px;color:var(--gold);font-weight:700;letter-spacing:.02em}
.hero h1{font-size:36px;margin:8px 0 10px}
.numgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.numgrid .opt{justify-content:center;min-height:56px;font-size:18px;font-weight:800}

/* 교사 패널 */
#teacher{position:fixed;inset:0;z-index:80;background:rgba(14,27,42,.94);display:none;overflow:auto;padding:24px 16px}
#teacher.show{display:block}
#teacher .card{max-width:520px;margin:0 auto 14px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.note{font-size:14px;color:var(--muted)}
.status{
  position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:30;
  font-size:12px;font-weight:700;color:rgba(245,239,225,.55);
  background:rgba(14,27,42,.85);border-radius:999px;padding:4px 10px;
}

/* 사진 촬영 */
.shot{
  width:100%;min-height:120px;border:2px dashed var(--line);border-radius:12px;
  background:#fff;color:var(--text);font:inherit;font-weight:700;font-size:17px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:20px;cursor:pointer;
}
.shot .big{font-size:40px;line-height:1}
.shot small{color:var(--muted);font-weight:600;font-size:14px}
.preview{position:relative;border-radius:12px;overflow:hidden;background:#000;line-height:0}
.preview img{width:100%;display:block}
.preview .meta{
  position:absolute;left:8px;bottom:8px;background:rgba(14,27,42,.82);color:var(--paper);
  border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;line-height:1.4;
}
.auto .shotthumb{width:84px;border-radius:8px;display:block;margin-top:4px}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gal figure{margin:0}
.gal img{width:100%;border-radius:8px;display:block}
.gal figcaption{font-size:12px;color:var(--muted);text-align:center;margin-top:4px;font-weight:700}
.busy{opacity:.55;pointer-events:none}

/* 기억 카드 뒤집기 — 미션 완료 때 한 번만 */
.flip{perspective:1000px;margin:0 0 18px}
.flip .inner{
  position:relative;width:100%;aspect-ratio:5/3;
  transform-style:preserve-3d;transform:rotateY(180deg);
  transition:transform .85s cubic-bezier(.3,.9,.3,1);
}
.flip.open .inner{transform:rotateY(0)}
.flip .face{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:18px;
}
.flip .back{
  transform:rotateY(180deg);
  background:repeating-linear-gradient(45deg,#1E3550,#1E3550 9px,#223C5B 9px,#223C5B 18px);
  border:2px solid rgba(217,164,65,.55);color:rgba(217,164,65,.85);
  font-size:15px;font-weight:800;gap:8px;
}
.flip .back .q{font-size:44px;line-height:1}
.flip .front{
  background:var(--paper);color:var(--text);
  border:2px solid var(--gold);box-shadow:0 8px 0 rgba(0,0,0,.2);
}
.flip .front .ic{font-size:44px;line-height:1;margin-bottom:8px}
.flip .front b{font-size:19px;font-weight:900;letter-spacing:-.02em}
.flip .front span{font-size:15px;color:var(--muted);font-weight:600;margin-top:5px}
.tapme{text-align:center;font-size:15px;color:var(--gold);font-weight:700;margin:-8px 0 16px}

.badgein{animation:pop .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}

/* 사진 고르기 */
.pickgal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pickgal button{
  position:relative;padding:0;border:3px solid var(--line);border-radius:10px;
  overflow:hidden;background:#000;line-height:0;cursor:pointer;
}
.pickgal button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px rgba(217,164,65,.6)}
.pickgal img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
.pickgal .cap{
  position:absolute;left:0;right:0;bottom:0;background:rgba(14,27,42,.8);
  color:var(--paper);font-size:13px;font-weight:700;padding:4px;line-height:1.3;
}

/* 승인 체크 */
.appr{display:flex;flex-direction:column;gap:9px}

/* 결과 이미지 */
#poster{width:100%;border-radius:12px;display:block;margin:0 0 14px;background:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <header id="bar" class="hidden">
    <div class="barrow">
      <span class="group" id="gLabel"></span>
      <div class="slots" id="slots"></div>
    </div>
    <div class="turn none" id="turn"></div>
  </header>
  <main id="view"></main>
  <footer id="act"></footer>
</div>

<div id="handoff">
  <div class="icon" id="hoIcon"></div>
  <div class="role" id="hoRole"></div>
  <div class="who" id="hoWho"></div>
  <p class="hint">태블릿을 넘겨주세요</p>
  <button id="hoBtn"></button>
</div>

<div id="teacher">
  <div class="card">
    <h3>교사 설정</h3>
    <p class="sub">학생에게는 보이지 않는 화면입니다.</p>
    <label class="field">탐정 회의(중간 점검)</label>
    <div class="opts" id="tConf"></div>
    <label class="field" style="margin-top:16px">통과 암호</label>
    <input type="text" id="tPw">
    <p class="note" style="margin-top:8px">세 번째 미션이 끝나면 교사에게 30초 발표를 하고 이 암호를 받습니다.</p>
  </div>
  <div class="card">
    <h3>기록 관리</h3>
    <div class="row">
      <button class="opt" onclick="backup()">기록 내려받기</button>
      <button class="opt" onclick="wipe()">처음부터 다시</button>
    </div>
    <p class="note" style="margin-top:10px">이 태블릿에 저장된 우리 모둠 기록만 해당됩니다.</p>
  </div>
  <div class="card">
    <h3>실시간 전송</h3>
    <p class="sub" id="syncState">확인 중</p>
    <label class="field">데이터베이스 주소</label>
    <input type="text" id="tDb" placeholder="https://○○○-default-rtdb.firebasedatabase.app">
    <label class="field" style="margin-top:14px">웹 API 키</label>
    <input type="text" id="tKey" placeholder="AIza…">
    <p class="note" style="margin-top:10px">비워 두면 이 태블릿에만 저장됩니다. 활동은 그대로 진행됩니다.</p>
    <button class="opt wide" style="margin-top:12px" onclick="flushNow(true)">지금 전송하기</button>
  </div>
  <div class="card">
    <h3>1차 버전에서 빠진 것</h3>
    <p class="sub" style="margin:0">미션 5(동이의 하루), 보너스 미션, 교사 대시보드 화면은 다음 버전에서 붙입니다.</p>
  </div>
  <button class="go" onclick="closeTeacher()">닫기</button>
</div>

<div class="status" id="status"></div>

<script>
/* ══════════════════════════════════════════════════
   1. 데이터 — 미션 내용은 전부 여기에만 있습니다.
      문항을 고칠 때 아래 TOPICS만 수정하면 됩니다.
   ══════════════════════════════════════════════════ */

const ROLES = {
  evidence:{name:'증거 탐정', icon:'🔍', color:'var(--r-evidence)', raw:'#2F6FA8', job:'설명판에서 단서를 찾아야 기억이 살아나요'},
  photo   :{name:'사진 탐정', icon:'📷', color:'var(--r-photo)',    raw:'#3E7C59', job:'증거 사진이 있어야 기억을 저장할 수 있어요'},
  record  :{name:'기록 탐정', icon:'✏️', color:'var(--r-record)',   raw:'#7A5AA8', job:'기록을 잘 해야 기억의 조각이 남아요'},
  present :{name:'발표 탐정', icon:'🎤', color:'var(--r-present)',  raw:'#D9873A', job:'발표를 해야 동이에게 기억을 설명할 수 있어요'}
};

// 역할 자동 교대표 (스토리보드 2쪽)
const ROT = {
  early:{A:'evidence', B:'photo',    C:'record', D:'present'},  // 1~3번째 미션
  late :{A:'present',  B:'evidence', C:'photo',  D:'record'}     // 4번째 미션부터
};

const ORDER = ['nature','farm','house','market'];

const LEVELS = ['🐣 견습 탐정','🔍 단서 탐정','🌾 생활 탐정','🧩 기억 탐정','🛒 장터 탐정'];

const TOPICS = {

nature:{
  title:'남도의 자연', emoji:'🌿',
  dongi:'내가 살던 남도는 따뜻했던 것 같아. 왜 그랬는지 자연 전시에서 단서를 찾아줘.',
  goals:['남도의 자연 설명판 읽기','남도가 따뜻한 이유 찾기','자연이 사람들의 생활에 준 영향 찾기'],
  evidence:[{
    id:'w', type:'multi',
    prompt:'설명판에서 남도가 따뜻한 이유와 관련 있는 단어를 모두 찾으세요.',
    options:['바다','해류','봄','여름','마룻방'], other:true,
    answer:['바다','해류'],
    ok:'정답입니다! 남도는 바다와 맞닿아 있고, 따뜻한 해류의 영향을 받아 일 년 내내 포근합니다.',
    no:'다시 생각해 봅시다. 따뜻한 남도에서 나타난 생활 모습과, 남도가 따뜻한 까닭을 구분해 보세요.'
  }],
  record:[{
    id:'effect', type:'single',
    prompt:'따뜻한 자연은 사람들의 집에 어떤 영향을 주었나요?',
    options:['마루가 발달했다','성벽이 높아졌다','배가 작아졌다','시장이 사라졌다'],
    answer:'마루가 발달했다',
    ok:'정답입니다! 남도는 따뜻하고 여름이 길어서, 시원하게 지낼 수 있는 마루가 발달했습니다.',
    no:'다시 생각해 봅시다. 자연환경이 집에 준 영향을 묻고 있습니다.'

/* ══════════════════════════════════════════════════
   2. 상태 저장 · 복구
   ══════════════════════════════════════════════════ */

const KEY = 'gjhfm-v1';
let S = null;

function blankTopic(){
  return {evidence:{}, record:{}, photo:null, prep:{}, submit:{}, agree:{}, tries:{}, done:false};
}
function blankFinal(){
  return {evidence:['','','',''], pick:[], photoText:['',''], story:['','','',''],
          speech:['','','','','',''], compare:[], agree:{}, done:false};
}
function blankBonus(){
  return {roles:{evidence:'',photo:'',record:'',present:''}, photo:null,
          name:'', word:'', why:'', meaning:'', ad:'',
          appr:{observe:[],why:[],meaning:[],ad:[],final:[]}, done:false};
}
/* 활동 중에 파일을 새 버전으로 바꿔도 하던 자리를 잃지 않도록 */
function migrate(){
  if(!S.final) S.final=blankFinal();
  if(!S.bonus) S.bonus=blankBonus();
  if(S.phase==='run'){
    const here=S.steps && S.steps[S.stepIdx];
    if(!S.steps || !S.steps.some(s=>s.v==='fintro')){
      buildSteps();
      if(here){
        const i=S.steps.findIndex(s=>s.v===here.v && s.t===here.t);
        S.stepIdx = i>=0 ? i : 0;
      }
    }
  }
}
function newState(){
  return {
    v:1, session:'', groupNo:0,
    members:{A:'',B:'',C:'',D:''},
    order:[], prior:{choice:'',reason:''},
    topics:{nature:blankTopic(),farm:blankTopic(),house:blankTopic(),market:blankTopic()},
    conference:{text:'',passed:false},
    final:blankFinal(), bonus:blankBonus(),
    settings:{useConference:true, password:'마루', dbUrl:'', apiKey:''},
    phase:'start', stepIdx:0, steps:[], seenHandoff:{},
    startedAt:Date.now(), updatedAt:Date.now()
  };
}
function save(opts){
  if(!S) return;
  S.updatedAt = Date.now();
  try{
    localStorage.setItem(KEY, JSON.stringify(S));
    if(!(opts && opts.quiet)) flash('저장됨');
  }
  catch(e){ flash('저장 공간이 부족합니다'); }
  markDirty(opts && opts.photo);
}
function load(){
  try{ const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
let flashT;
function flash(t){
  const el = document.getElementById('status');
  el.textContent = t; clearTimeout(flashT);
  flashT = setTimeout(showStatus,1400);
}

/* ══════════════════════════════════════════════════
   3. 진행 순서 만들기 (모둠별 회전)
   ══════════════════════════════════════════════════ */

function rotate(arr,n){ n = ((n % arr.length)+arr.length)%arr.length; return arr.slice(n).concat(arr.slice(0,n)); }

function buildSteps(){
  S.order = rotate(ORDER, S.groupNo - 1);
  const steps = [{v:'map'}];
  S.order.forEach((t,i)=>{
    steps.push({v:'intro',    t, m:i+1});
    steps.push({v:'evidence', t, m:i+1, role:'evidence'});
    steps.push({v:'record',   t, m:i+1, role:'record'});
    steps.push({v:'photo',    t, m:i+1, role:'photo'});
    steps.push({v:'prep',     t, m:i+1, role:'present'});
    steps.push({v:'submit',   t, m:i+1, role:'present'});
    steps.push({v:'complete', t, m:i+1});
    if(i===2 && S.settings.useConference) steps.push({v:'conference'});
  });
  // 미션 5 — 동이의 하루
  steps.push({v:'fintro',    m:5});
  steps.push({v:'fevidence', m:5, role:'evidence'});
  steps.push({v:'fphoto',    m:5, role:'photo'});
  steps.push({v:'frecord',   m:5, role:'record'});
  steps.push({v:'fpresent',  m:5, role:'present'});
  steps.push({v:'fcompare',  m:5, role:'present'});
  steps.push({v:'fsubmit',   m:5, role:'present'});
  steps.push({v:'fcomplete', m:5});
  // 보너스 — 최고의 큐레이터
  steps.push({v:'bintro'});
  steps.push({v:'bobserve'});
  steps.push({v:'bwhy'});
  steps.push({v:'bmeaning'});
  steps.push({v:'bad'});
  steps.push({v:'bfinal'});
  steps.push({v:'bcomplete'});
  steps.push({v:'end'});
  S.steps = steps;
}
function levelName(){
  if(S.bonus && S.bonus.done) return '🎨 어린이 큐레이터';
  if(S.final && S.final.done) return '👑 남도 생활 마스터';
  return LEVELS[doneCount()];
}

function whoIs(role, missionNo){
  const table = missionNo <= 3 ? ROT.early : ROT.late;
  const slot = Object.keys(table).find(k => table[k] === role);
  return {slot, name: S.members[slot] || slot};
}

function renderPart(p, saved){
  if(p.type==='multi' || p.type==='depend' || p.type==='single'){
    const chosen = saved && saved[p.id] ? [].concat(saved[p.id]) : [];
    const wide = p.options.some(o=>o.length>8);

      ${p.limit?`<p class="sub">${p.limit}개만 고르세요.</p>`:''}
      <div class="opts" data-part="${p.id}" data-type="${p.type}" ${p.limit?`data-limit="${p.limit}"`:''}>
        ${p.options.map(o=>`<button class="opt ${wide?'wide':''}" data-v="${esc(o)}" aria-pressed="${chosen.includes(o)}"><span class="box"></span>${esc(o)}</button>`).join('')}
      </div>
      ${p.other?`<label class="field" style="margin-top:14px">기타</label>
        <input type="text" data-other="${p.id}" placeholder="찾은 낱말을 직접 적어도 좋아요" value="${esc(saved&&saved[p.id+'_other']||'')}">`:''}`;
  }
  if(p.type==='match'){
    const sv = saved && saved[p.id] || {};
    return `<h3>${esc(p.prompt)}</h3>
      <div data-part="${p.id}" data-type="match">
        ${p.left.map(l=>`<div class="pair">
          <span class="k">${esc(l)}</span>
          <select data-k="${esc(l)}">
            <option value="">고르기</option>
            ${p.right.map(r=>`<option ${sv[l]===r?'selected':''}>${esc(r)}</option>`).join('')}
          </select></div>`).join('')}
      </div>`;
  }
  if(p.type==='fill'){
    const sv = saved && saved[p.id] || [];
    let html = `<h3>${esc(p.prompt||'')}</h3><p class="fill" data-part="${p.id}" data-type="fill">`;
    p.parts.forEach((txt,i)=>{
      html += esc(txt);
      if(i < p.parts.length-1) html += `<input type="text" data-i="${i}" placeholder="${esc(p.ph[i]||'')}" value="${esc(sv[i]||'')}">`;
    });
    return html + '</p>' + sampleBtn(p.sample);
  }
  return '';
}
function sampleBtn(sample){
  return sample ? `<button class="linkbtn" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">예시 보기</button>
    <div class="fb tip" hidden>${esc(sample)}</div>` : '';
}
function readPart(p, root){
  const box = root.querySelector(`[data-part="${p.id}"]`);
  if(!box) return null;
  if(p.type==='match'){
    const out={}; box.querySelectorAll('select').forEach(s=>{ if(s.value) out[s.dataset.k]=s.value; });
    return Object.keys(out).length===p.left.length ? out : null;
  }
  if(p.type==='fill'){
    const vals=[...box.querySelectorAll('input')].map(i=>i.value.trim());
    return vals.every(v=>v) ? vals : null;
  }
  const sel=[...box.querySelectorAll('[aria-pressed="true"]')].map(b=>b.dataset.v);
  const other = root.querySelector(`[data-other="${p.id}"]`);
  const otherVal = other ? other.value.trim() : '';
  if(p.type==='single') return sel[0] || null;
  if(!sel.length && !otherVal) return null;
  if(p.limit && sel.length !== p.limit) return null;
  return {list:sel, other:otherVal};
}
function gradePart(p, val, ctx){
  if(!p.answer && p.type!=='depend') return {graded:false};
  if(p.type==='single') return {graded:true, ok: val===p.answer};
  if(p.type==='match')  return {graded:true, ok: p.left.every(l=>val[l]===p.answer[l])};
  if(p.type==='multi'){
    const got=new Set(val.list), want=new Set(p.answer);
    const wrong=p.options.filter(o=>!want.has(o)&&got.has(o));
    return {graded:true, ok: p.answer.every(a=>got.has(a)) && !wrong.length};
  }
  if(p.type==='depend'){
    const words = (ctx[p.dependsOn]||{}).list || [];
    const allow = new Set(); words.forEach(w=>(p.map[w]||[]).forEach(m=>allow.add(m)));
    if(!allow.size) return {graded:false};
    return {graded:true, ok: val.list.length>0 && val.list.every(m=>allow.has(m))};
  }
  return {graded:false};
}

function bindOpts(){
  view.querySelectorAll('.opts[data-part]').forEach(box=>{
    const type=box.dataset.type, limit=+box.dataset.limit||0;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(type==='single'){
        box.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed','false'));
        b.setAttribute('aria-pressed','true'); return;
      }
      const on = b.getAttribute('aria-pressed')==='true';
      if(!on && limit && box.querySelectorAll('[aria-pressed="true"]').length>=limit)
        return flash(`${limit}개까지 고를 수 있어요`);
      b.setAttribute('aria-pressed', on?'false':'true');
    });
  });
}

/* 원본은 800px(발표·결과물용)으로 이 태블릿에만,
   썸네일은 200px(교사 확인용)만 전송합니다.            */
const PHOTO = {full:{max:800, q:0.6}, thumb:{max:200, q:0.5}};

function readFile(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('읽기 실패'));
    r.readAsDataURL(file);
  });
}
function loadImage(src){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>res(im); im.onerror=()=>rej(new Error('이미지 오류'));
    im.src=src;
  });
}
function resize(img, max, q){
  const s=Math.min(1, max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');
  c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  const g=c.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
  g.drawImage(img,0,0,c.width,c.height);
  return {data:c.toDataURL('image/jpeg',q), w:c.width, h:c.height};
}
async function makePhoto(file){
  const img=await loadImage(await readFile(file));
  const full=resize(img, PHOTO.full.max, PHOTO.full.q);
  const thumb=resize(img, PHOTO.thumb.max, PHOTO.thumb.q);
  return {full:full.data, thumb:thumb.data, w:full.w, h:full.h,
          kb:Math.round(full.data.length*0.73/1024), at:Date.now()};
}

function autoSummary(topicKey){
  const T=TOPICS[topicKey], d=S.topics[topicKey];
  let html='<dl class="auto">';

    const v=d.evidence[p.id]; if(!v) return;
    let txt;
    if(p.type==='match') txt = Object.keys(v).map(k=>`${k} → ${v[k]}`).join(' / ');
    else if(v.list) txt = `<span class="tagline">${v.list.concat(v.other?[v.other]:[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</span>`;
    else txt = esc(v);
    html += `<dt>증거 탐정이 찾은 것</dt><dd>${txt}</dd>`;
  });
  T.record.forEach(p=>{
    const v=d.record[p.id]; if(!v) return;
    let txt;
    if(p.type==='match') txt = Object.keys(v).map(k=>`${k} → ${v[k]}`).join(' / ');
    else if(Array.isArray(v)) txt = esc(joinFill(p, v));
    else txt = esc(v);
    html += `<dt>기록 탐정이 적은 것</dt><dd>${txt}</dd>`;
  });
  html += `<dt>사진 탐정이 찍은 사진</dt><dd>${
    d.photo ? `<img class="shotthumb" src="${d.photo.thumb}" alt="증거 사진">` : '아직 없음'}</dd>`;
  return html+'</dl>';
}
function joinFill(p, vals){
  return p.parts.map((t,i)=> t + (i<p.parts.length-1 ? (vals[i]||'____') : '')).join('');
}

let apprT=null;
async function checkApproval(){
  if(!syncReady() || !navigator.onLine) return false;
  try{
    const t=await getToken();
    const r=await fetch(`${base()}/approval.json?auth=${t}`);
    if(!r.ok) return false;
    const j=await r.json();
    return !!(j && j.approved);
  }catch(e){ return false; }
}
function stopApproval(){ if(apprT){ clearInterval(apprT); apprT=null; } }

function screenConference(){
  const found=S.order.filter(t=>S.topics[t].done);

    </div>`;
  const pass=()=>{

      document.getElementById('confText').value.trim() : S.conference.text;
    S.conference.passed=true; save(); next();
  };
  // 원격 승인은 8초마다 확인 — 신호가 없으면 암호로 통과합니다
  stopApproval();
  apprT=setInterval(async()=>{

      save(); return;
    }
    pass();
  });
}

function evidenceLine(t){
  const d=S.topics[t], out=[];
  TOPICS[t].evidence.forEach(p=>{
    const v=d.evidence[p.id]; if(!v) return;
    if(p.type==='match') out.push(Object.keys(v).join(', '));
    else if(v.list) out.push(v.list.concat(v.other?[v.other]:[]).join(', '));
    else out.push(String(v));
  });
  return out.join(' · ') || '기록 없음';
}
function autoEvidence(){
  return `<dl class="auto">${S.order.map(t=>
    `<dt>${TOPICS[t].emoji} ${TOPICS[t].title}</dt><dd>${esc(evidenceLine(t))}</dd>`).join('')}</dl>`;
}
function fillRow(id, parts, ph, vals){
  let h=`<p class="fill" data-fill="${id}">`;
  parts.forEach((txt,i)=>{
    h+=esc(txt);
    if(i<parts.length-1) h+=`<input type="text" data-i="${i}" placeholder="${esc(ph[i]||'')}" value="${esc(vals[i]||'')}">`;
  });
  return h+'</p>';
}
function readFill(id){
  const box=view.querySelector(`[data-fill="${id}"]`);
  return [...box.querySelectorAll('input')].map(i=>i.value.trim());
}

function wrapText(g, text, x, y, maxW, lh, maxLines){
  const words=String(text).split(/\s+/); let line='', n=0;
  for(const w of words){
    const test=line?line+' '+w:w;
    if(g.measureText(test).width>maxW && line){
      g.fillText(line, x, y+n*lh); n++; line=w;
      if(maxLines && n>=maxLines){ g.fillText('…', x, y+n*lh); return y+(n+1)*lh; }
    } else line=test;
  }
  if(line){ g.fillText(line, x, y+n*lh); n++; }
  return y+n*lh;
}
async function buildPoster(){
  const W=1080, H=1620, P=64;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  const F=n=>`${n}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif`;

  g.fillStyle='#16283C'; g.fillRect(0,0,W,H);
  g.fillStyle='#D9A441'; g.font='700 '+F(30);
  g.fillText('광주역사민속박물관 · 기억 탐정단', P, 96);
  g.fillStyle='#F5EFE1'; g.font='900 '+F(74);
  g.fillText('동이의 하루', P, 190);
  g.font='700 '+F(32); g.fillStyle='rgba(245,239,225,.72)';
  g.fillText(`${S.groupNo}모둠 · ${Object.values(S.members).join('  ')}`, P, 244);

  // 사진 띠
  const shots=S.order.filter(t=>S.topics[t].photo);
  const cw=(W-P*2-24*3)/4, ch=Math.round(cw*0.75);
  for(let i=0;i<4;i++){
    const x=P+i*(cw+24), y=290;
    g.fillStyle='#0E1B2A'; g.fillRect(x,y,cw,ch);
    const t=shots[i];
    if(t){
      const im=await loadImage(S.topics[t].photo.full);
      const s=Math.max(cw/im.width, ch/im.height);
      g.save(); g.beginPath(); g.rect(x,y,cw,ch); g.clip();
      g.drawImage(im, x+(cw-im.width*s)/2, y+(ch-im.height*s)/2, im.width*s, im.height*s);
      g.restore();
    }
    g.fillStyle='#D9A441'; g.font='700 '+F(26);
    g.fillText(TOPICS[S.order[i]].title.replace('남도의 ',''), x, y+ch+36);
  }

  // 이야기 카드
  let y=290+ch+80;
  const cardH=430;
  g.fillStyle='#F5EFE1'; g.fillRect(P,y,W-P*2,cardH);
  g.fillStyle='#243247'; g.font='900 '+F(38);
  g.fillText('우리가 복원한 동이의 하루', P+40, y+72);
  g.font='400 '+F(32); g.fillStyle='#243247';
  const story=['동이는 ',' 자연환경 속에서 살았습니다. 동이의 가족은 ','을 통해 먹을 것을 얻었습니다. 동이는 집에서 ','을 이용해 생활했습니다. 시장에서는 ','을 얻거나 나눌 수 있었습니다.']
    .map((t,i)=>t+(S.final.story[i]||'')).join('');
  let ty=wrapText(g, story, P+40, y+128, W-P*2-80, 48, 5);
  g.fillStyle='#6B7688'; g.font='700 '+F(26);
  g.fillText('가장 중요한 증거', P+40, ty+34);
  g.fillStyle='#243247'; g.font='700 '+F(30);
  wrapText(g, S.final.evidence.filter(Boolean).join(' · '), P+40, ty+76, W-P*2-80, 42, 2);

  // 보너스
  y += cardH+44;
  if(S.bonus.done){
    g.fillStyle='rgba(217,164,65,.16)'; g.fillRect(P,y,W-P*2,250);
    g.strokeStyle='#D9A441'; g.lineWidth=2; g.strokeRect(P,y,W-P*2,250);
    g.fillStyle='#D9A441'; g.font='700 '+F(28);
    g.fillText('우리가 남기고 싶은 전시물', P+40, y+58);
    g.fillStyle='#F5EFE1'; g.font='900 '+F(40);
    g.fillText(S.bonus.name, P+40, y+112);
    g.font='400 '+F(30); g.fillStyle='rgba(245,239,225,.85)';
    wrapText(g, '“'+S.bonus.ad+'”', P+40, y+164, W-P*2-80, 42, 2);
    y+=250+44;
  }

  // 배지
  g.fillStyle='#D9A441'; g.font='700 '+F(30);
  g.fillText(levelName(), P, y+40);
  g.fillStyle='rgba(245,239,225,.5)'; g.font='400 '+F(26);
  g.fillText(new Date().toLocaleDateString('ko-KR')+' · '+(S.session||'기억 탐정단'), P, y+86);

  return c.toDataURL('image/jpeg', 0.9);
}

async function savePoster(){
  flash('결과를 그리는 중');
  try{
    const url=await buildPoster();
    const img=document.getElementById('poster');

    const a=document.createElement('a');
    a.href=url; a.download=`동이의하루_${S.groupNo}모둠.jpg`; a.click();
    flash('저장했습니다');
  }catch(e){ flash('결과를 만들지 못했습니다'); }
}

/* ── 역할 전환 화면 ────────────────── */
function maybeHandoff(step){
  if(!step.role) return;
  const key = (step.t||'final') + ':' + step.v;
  if(S.seenHandoff[key]) return;
  const r=ROLES[step.role], w=whoIs(step.role, step.m);
  const ho=document.getElementById('handoff');
  ho.style.setProperty('--role', r.raw);
  document.getElementById('hoIcon').textContent=r.icon;
  document.getElementById('hoRole').textContent=r.name+' 차례예요';
  document.getElementById('hoWho').textContent=w.name;
  const b=document.getElementById('hoBtn');
  b.textContent=`제가 ${w.name}입니다`;
  b.onclick=()=>{ S.seenHandoff[key]=Date.now(); save(); ho.classList.remove('show'); };
  ho.classList.add('show');
}

/* ── 이동 ─────────────────────────── */
function next(){ S.stepIdx=Math.min(S.stepIdx+1, S.steps.length-1); save(); render(); }

/* ── 교사 패널 ─────────────────────── */
function longPressTeacher(){
  const h1=view.querySelector('h1'); if(!h1) return;
  let t;
  const down=()=>{ t=setTimeout(openTeacher,1500); };
  const up=()=>clearTimeout(t);
  h1.addEventListener('touchstart',down); h1.addEventListener('touchend',up);
  h1.addEventListener('mousedown',down);  h1.addEventListener('mouseup',up);
  h1.addEventListener('mouseleave',up);
}
function openTeacher(){
  const p=document.getElementById('teacher');
  document.getElementById('tPw').value=S.settings.password;
  document.getElementById('tDb').value=S.settings.dbUrl||FB.dbUrl||'';
  document.getElementById('tKey').value=S.settings.apiKey||FB.apiKey||'';
  const n=(SY.mainDirty?1:0)+Object.keys(SY.photos).length;
  document.getElementById('syncState').textContent = !syncReady()
    ? '설정이 비어 있어 이 태블릿에만 저장됩니다.'
    : (navigator.onLine ? (n?`연결됨 · 전송 대기 ${n}건`:'연결됨 · 모두 전송했습니다')
                        : `오프라인 · 전송 대기 ${n}건`);
  document.getElementById('tConf').innerHTML=['사용함','사용 안 함'].map((l,i)=>
    `<button class="opt" data-v="${i===0}" aria-pressed="${S.settings.useConference===(i===0)}"><span class="box"></span>${l}</button>`).join('');
  p.querySelectorAll('#tConf .opt').forEach(b=>b.onclick=()=>{
    p.querySelectorAll('#tConf .opt').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    S.settings.useConference = b.dataset.v==='true';
  });
  p.classList.add('show');
}
function closeTeacher(){
  S.settings.password=document.getElementById('tPw').value.trim()||'마루';
  S.settings.dbUrl=document.getElementById('tDb').value.trim();
  S.settings.apiKey=document.getElementById('tKey').value.trim();
  save(); flushNow();
  document.getElementById('teacher').classList.remove('show');
}
function backup(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`동이기억_${S.session||'세션'}_${S.groupNo}모둠.json`;
  a.click();
}
function wipe(){
  if(!confirm('이 태블릿의 기록을 모두 지우고 처음부터 시작할까요?')) return;
  localStorage.removeItem(KEY);
  SY={mainDirty:false, photos:{}, metaDone:false, idToken:'', refreshToken:'', exp:0};
  saveSync(); S=newState(); render(); showStatus();
}

/* ══════════════════════════════════════════════════
   7. 실시간 전송 — 로컬이 원본, 파이어베이스는 사본
      신호가 끊겨도 활동은 그대로 진행되고,
      돌아오면 밀린 것이 한꺼번에 올라갑니다.
   ══════════════════════════════════════════════════ */

/* 배포 전에 여기를 채우면 모든 태블릿의 기본값이 됩니다.
   비워 두면 교사 설정 화면에서 넣을 수 있습니다. */
const FB = {
  dbUrl : '',   // 예) https://gjhfm-default-rtdb.asia-southeast1.firebasedatabase.app
  apiKey: ''    // 예) AIzaSy...
};

const SKEY='gjhfm-sync';
let SY = (()=>{ try{ return JSON.parse(localStorage.getItem(SKEY)) || null; }catch(e){ return null; } })()
      || {mainDirty:false, photos:{}, metaDone:false, idToken:'', refreshToken:'', exp:0};
function saveSync(){ try{ localStorage.setItem(SKEY, JSON.stringify(SY)); }catch(e){} }

function cfg(){
  const s=(S && S.settings) || {};
  return {dbUrl:(s.dbUrl||FB.dbUrl||'').replace(/\/+$/,''), apiKey:s.apiKey||FB.apiKey||''};
}
function syncReady(){ const c=cfg(); return !!(c.dbUrl && c.apiKey && S && S.session && S.groupNo); }

let flushT, busy=false;
function markDirty(photoTopic){
  SY.mainDirty=true;
  if(photoTopic) SY.photos[photoTopic]=true;
  saveSync(); showStatus();
  clearTimeout(flushT); flushT=setTimeout(()=>flushNow(), 3000);
}
function showStatus(){
  const el=document.getElementById('status'); if(!el) return;
  if(!syncReady()){ el.textContent='⚪ 이 태블릿에 저장'; return; }
  if(!navigator.onLine){ el.textContent='🟡 오프라인 · 저장 대기'; return; }
  const n=(SY.mainDirty?1:0)+Object.keys(SY.photos).length;
  el.textContent = busy ? '🔵 전송 중' : (n ? `🟡 전송 대기 ${n}` : '🟢 전송 완료');
}

async function getToken(){
  const c=cfg();
  if(SY.idToken && SY.exp > Date.now()+300000) return SY.idToken;
  const body = SY.refreshToken
    ? {url:`https://securetoken.googleapis.com/v1/token?key=${c.apiKey}`,
       payload:{grant_type:'refresh_token', refresh_token:SY.refreshToken}}
    : {url:`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${c.apiKey}`,
       payload:{returnSecureToken:true}};
  const res=await fetch(body.url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body.payload)});
  if(!res.ok){ SY.refreshToken=''; throw new Error('auth'); }
  const j=await res.json();
  SY.idToken = j.idToken || j.id_token;
  SY.refreshToken = j.refreshToken || j.refresh_token;
  SY.exp = Date.now() + (+(j.expiresIn||j.expires_in||3600))*1000;
  saveSync();
  return SY.idToken;
}

function base(){
  const c=cfg();
  return `${c.dbUrl}/sessions/${encodeURIComponent(S.session)}/groups/g${S.groupNo}`;
}
function mainPayload(){
  const step=S.steps[S.stepIdx]||{};
  const topics={};
  S.order.forEach(t=>{
    const d=S.topics[t];
    topics[t]={evidence:d.evidence, record:d.record, prep:d.prep, submit:d.submit,
               agree:d.agree, tries:d.tries, done:d.done,
               photoTaken:!!d.photo, photoAt:d.photo?d.photo.at:null};
  });
  return {
    session:S.session, groupNo:S.groupNo, members:S.members, order:S.order, prior:S.prior,
    conference:S.conference, useConference:S.settings.useConference,
    final:S.final,
    bonus:{roles:S.bonus.roles, name:S.bonus.name, word:S.bonus.word, why:S.bonus.why,
           meaning:S.bonus.meaning, ad:S.bonus.ad, appr:S.bonus.appr, done:S.bonus.done,
           photoTaken:!!S.bonus.photo},
    progress:{
      view:step.v||'', mission:step.m||0, topic:step.t||'',
      role:step.role||'', roleName:step.role?whoIs(step.role, step.m).name:'',
      missionsDone:doneCount(), level:levelName(),
      finalDone:!!S.final.done, bonusDone:!!S.bonus.done
    },
    topics, startedAt:S.startedAt, updatedAt:S.updatedAt
  };
}
async function put(path, data, token){
  const res=await fetch(`${path}.json?auth=${token}`,{
    method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
  if(!res.ok) throw new Error(await res.text());
}

async function flushNow(manual){
  if(busy) return;
  if(!syncReady()){ if(manual) flash('전송 설정이 비어 있습니다'); showStatus(); return; }
  if(!navigator.onLine){ if(manual) flash('연결이 없습니다'); showStatus(); return; }
  if(!SY.mainDirty && !Object.keys(SY.photos).length && !manual){ showStatus(); return; }
  busy=true; showStatus();
  try{
    const token=await getToken();
    const c=cfg();
    if(!SY.metaDone){
      await put(`${c.dbUrl}/sessions/${encodeURIComponent(S.session)}/meta`,
        {createdAt:S.startedAt, lastSeen:Date.now()}, token);
      SY.metaDone=true; saveSync();
    }
    if(SY.mainDirty || manual){
      await put(base(), mainPayload(), token);
      SY.mainDirty=false; saveSync();
    }
    for(const t of Object.keys(SY.photos)){
      const p = t==='bonus' ? S.bonus.photo : (S.topics[t] && S.topics[t].photo);
      if(!p){ delete SY.photos[t]; continue; }
      await put(`${base()}/photos/${t}`, {thumb:p.thumb, at:p.at, w:p.w, h:p.h}, token);
      delete SY.photos[t]; saveSync();
    }
    if(manual) flash('전송했습니다');
  }catch(e){
    if(manual) flash('전송 실패 · 나중에 다시 보냅니다');
  }
  busy=false; showStatus();
}

window.addEventListener('online', ()=>flushNow());
window.addEventListener('offline', showStatus);
setInterval(()=>flushNow(), 20000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') flushNow(); });

/* ── 화면 꺼짐 방지 ────────────────── */
let lock=null;
async function keepAwake(){
  try{ if('wakeLock' in navigator) lock=await navigator.wakeLock.request('screen'); }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') keepAwake(); });

/* ── 시작 ─────────────────────────── */
S = load() || newState();
if(S.phase!=='start'){ migrate(); } else { S = newState(); }
render();
keepAwake();
showStatus();
flushNow();
</script>
